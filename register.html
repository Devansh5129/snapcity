
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your SnapCity account."
    >

    <title>SnapCity — Create Account</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="auth-page">

        <div class="auth-wrapper">

            <a
                href="index.html"
                class="auth-logo"
            >
                Snap<span>City</span>
            </a>

            <section class="auth-card">

                <div class="auth-header">

                    <span class="auth-eyebrow">
                        JOIN SNAPCITY
                    </span>

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Discover useful places and make settling
                        into a new city easier.
                    </p>

                </div>

                <form
                    id="registerForm"
                    class="auth-form"
                >

                    <div class="auth-field">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <div class="auth-field">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="auth-field">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="auth-submit-button"
                    >
                        Create Account
                    </button>

                </form>

                <p
                    id="registerMessage"
                    class="auth-message"
                    aria-live="polite"
                ></p>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

                <a
                    href="index.html"
                    class="auth-back-link"
                >
                    ← Back to SnapCity
                </a>

            </section>

        </div>

    </main>

    <script src="js/register.js"></script>

</body>

</html>
