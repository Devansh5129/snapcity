
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Login to your SnapCity account."
    >

    <title>SnapCity — Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-wrapper">

            <a href="index.html" class="auth-logo">
                Snap<span>City</span>
            </a>

<button
    type="button"
    id="themeToggle"
    class="theme-toggle auth-theme-toggle"
    aria-label="Switch to dark theme"
    title="Switch theme"
>
    🌙
</button>

            <section class="auth-card">

                <div class="auth-header">

                    <span class="auth-eyebrow">
                        WELCOME BACK
                    </span>

                    <h1>
                        Login to SnapCity
                    </h1>

                    <p>
                        Sign in to continue exploring your city.
                    </p>

                </div>

                <form id="loginForm" class="auth-form">

                    <div class="auth-field">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="auth-field">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="auth-submit-button"
                    >
                        Login
                    </button>

                </form>

                <p
                    id="loginMessage"
                    class="auth-message"
                    aria-live="polite"
                ></p>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">
                        Create one
                    </a>
                </p>

                <a
                    href="index.html"
                    class="auth-back-link"
                >
                    ← Back to SnapCity
                </a>

            </section>

        </div>

    </main>


<script src="js/theme.js"></script>
<script src="js/login.js"></script>


</body>

</html>
